<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anton Romankov - Software Engineer</title>
    <link rel="icon" href="resources/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <style>
        @page {
            size: A4;
            margin: 10mm 0;
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: #e5e5e5 url("resources/bg-tile.jpg") top center / 1086px auto repeat fixed;
        }

        body {
            margin: 0;
            padding: 24px 16px;
            font-family: "Source Serif 4", "Latin Modern Roman", Georgia, serif;
            font-size: 10pt;
            line-height: 1.3;
            color: #111;
        }

        a {
            color: inherit;
        }

        .page {
            max-width: 210mm;
            margin: 0 auto;
            padding: 12mm 14mm;
            background: #fff;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .15);
        }

        /* Header: name, tagline, contacts */
        h1 {
            text-align: center;
            font-size: 24pt;
            font-weight: 700;
            font-variant: small-caps;
            letter-spacing: .5pt;
            margin: 0 0 2pt;
        }

        .tagline,
        .contacts {
            text-align: center;
            margin: 0 0 2pt;
        }

        .contacts {
            font-size: 9.5pt;
        }

        hr {
            display: none;
        }

        /* Sections */
        h2 {
            font-size: 12.5pt;
            font-weight: 600;
            font-variant: small-caps;
            letter-spacing: .5pt;
            margin: 12pt 0 5pt;
            padding-bottom: 1pt;
            border-bottom: 0.8pt solid #111;
            break-after: avoid;
        }

        p {
            margin: 0 0 4pt;
        }

        ul {
            margin: 2pt 0 3pt;
            padding-left: 14pt;
        }

        li {
            margin-bottom: 1.5pt;
        }

        /* Skills table */
        table {
            border-collapse: collapse;
            font-size: 9.5pt;
        }

        thead {
            display: none;
        }

        td {
            padding: 1pt 0;
            vertical-align: top;
        }

        td:first-child {
            white-space: nowrap;
            padding-right: 10pt;
        }

        td strong {
            font-weight: 600;
        }

        /* Experience / education entries */
        .entry {
            margin-bottom: 8pt;
        }

        .entry-head {
            break-after: avoid;
            margin-bottom: 2pt;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 12pt;
        }

        .favicon {
            width: 11pt;
            height: 11pt;
            margin-right: 3pt;
            vertical-align: -1.5pt;
        }

        .row .right {
            white-space: nowrap;
            text-align: right;
        }

        .row.main {
            font-weight: 700;
            font-size: 10.5pt;
        }

        .row.sub {
            font-style: italic;
            font-size: 9.5pt;
        }

        .entry ul {
            font-size: 9.5pt;
        }

        .stack {
            font-size: 9pt;
            color: #333;
        }

        .error {
            text-align: center;
            color: #a00;
        }

        .print {
            position: fixed;
            right: 16px;
            bottom: 16px;
            padding: 8px 14px;
            border: 0;
            background: #111;
            color: #fff;
            font-family: system-ui, sans-serif;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
        }

        @media (max-width: 640px) {
            body {
                padding: 0;
            }

            .page {
                padding: 20px 16px;
                box-shadow: none;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }

            .row .right {
                text-align: left;
            }

            td:first-child {
                white-space: normal;
            }
        }

        @media print {
            html {
                background: #fff;
            }

            body {
                padding: 0;
            }

            .page {
                box-shadow: none;
                padding-top: 0;
                padding-bottom: 0;
            }

            .entry {
                break-inside: avoid;
            }

            .print {
                display: none;
            }
        }
    </style>
</head>

<body>
    <main class="page" id="resume"></main>
    <button class="print" onclick="window.print()">Save as PDF</button>

    <script>
        // All content lives in summary.md; this script only renders and lays it out.
        const SOURCE = 'summary.md';
        const root = document.getElementById('resume');

        // "Left · Right" -> [left, right]
        function splitDot(text) {
            const i = text.indexOf(' · ');
            return i < 0 ? [text, ''] : [text.slice(0, i), text.slice(i + 3)];
        }

        function row(cls, leftHtml, rightHtml) {
            const div = document.createElement('div');
            div.className = 'row ' + cls;
            div.innerHTML = `<span>${leftHtml}</span><span class="right">${rightHtml}</span>`;
            return div;
        }

        function layout() {
            // Header: the paragraphs between h1 and the first hr/h2
            let el = root.querySelector('h1')?.nextElementSibling;
            const headerParas = [];
            while (el && el.tagName === 'P') {
                headerParas.push(el);
                el = el.nextElementSibling;
            }
            if (headerParas[0]) headerParas[0].className = 'tagline';
            if (headerParas[1]) headerParas[1].className = 'contacts';

            // "*Stack: ...*" paragraphs
            root.querySelectorAll('p').forEach(p => {
                if (p.children.length === 1 && p.firstElementChild.tagName === 'EM'
                    && p.textContent.startsWith('Stack:')) {
                    p.className = 'stack';
                }
            });

            // Group each h3 with everything up to the next heading into an .entry,
            // and turn "### Company · Title" + "*Dates · Location*" into two aligned rows.
            root.querySelectorAll('h3').forEach(h3 => {
                const entry = document.createElement('div');
                entry.className = 'entry';
                h3.before(entry);

                const [company, title] = splitDot(h3.innerHTML);
                const head = document.createElement('div');
                head.className = 'entry-head';
                let dates = '', location = '';

                let next = h3.nextElementSibling;
                if (next && next.tagName === 'P' && next.children.length === 1
                    && next.firstElementChild.tagName === 'EM' && !next.classList.contains('stack')) {
                    [dates, location] = splitDot(next.firstElementChild.innerHTML);
                    const after = next.nextElementSibling;
                    next.remove();
                    next = after;
                }
                head.append(row('main', company, dates), row('sub', title, location));
                entry.append(head);
                h3.remove();

                while (next && !/^H[1-3]$/.test(next.tagName)) {
                    const after = next.nextElementSibling;
                    entry.append(next);
                    next = after;
                }
            });

            // Company links in entry headers get the site's favicon
            root.querySelectorAll('.row.main a[href^="http"]').forEach(a => {
                const img = document.createElement('img');
                img.className = 'favicon';
                img.alt = '';
                img.src = `https://www.google.com/s2/favicons?domain=${new URL(a.href).hostname}&sz=32`;
                img.onerror = () => img.remove();
                a.prepend(img);
            });

            root.querySelectorAll('a[href^="http"]').forEach(a => {
                a.target = '_blank';
                a.rel = 'noopener';
            });
        }

        fetch(SOURCE, { cache: 'no-cache' })
            .then(r => {
                if (!r.ok) throw new Error(`${SOURCE}: HTTP ${r.status}`);
                return r.text();
            })
            .then(md => {
                root.innerHTML = marked.parse(md);
                layout();
                const name = root.querySelector('h1')?.textContent;
                if (name) document.title = `${name} - Software Engineer`;
            })
            .catch(err => {
                root.innerHTML = `<p class="error">Could not load ${SOURCE} (${err.message}).<br>
                    Serve the folder over HTTP, e.g. <code>python3 -m http.server</code>.</p>`;
            });
    </script>
</body>

</html>
